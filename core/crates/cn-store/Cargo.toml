[package]
name = "cn-store"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
cn-model = { path = "../cn-model" }
cn-schema = { path = "../cn-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
crc32fast = "1"

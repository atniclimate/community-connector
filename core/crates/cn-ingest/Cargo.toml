[package]
name = "cn-ingest"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
cn-model = { path = "../cn-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde", "js"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Connector WASM Smoke</title>
    <style>
      body {
        color: #1d252c;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 960px;
      }

      h1 {
        font-size: 1.4rem;
        margin: 0 0 16px;
      }

      section {
        border-top: 1px solid #c7d0d8;
        padding: 14px 0;
      }

      pre {
        background: #f5f7f8;
        border: 1px solid #d8e0e6;
        border-radius: 6px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      .pass {
        color: #17633a;
        font-weight: 700;
      }

      .fail {
        color: #9f1d20;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">WASM smoke</h1>
      <div id="results" aria-live="polite"></div>
    </main>
    <script type="module" src="./smoke.ts"></script>
  </body>
</html>

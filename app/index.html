<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Navigator</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d1017;
      }
      #app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 22rem);
        grid-template-rows: auto auto minmax(320px, 1fr) auto;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
        color: #e6edf7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .cn-status {
        grid-column: 1 / -1;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid rgb(255 255 255 / 0.08);
        background: rgb(8 11 17 / 0.94);
        font-size: 14px;
        line-height: 1.4;
      }
      .cn-viz {
        grid-column: 1;
        grid-row: 2 / span 2;
        min-width: 0;
        min-height: 320px;
        clip-path: inset(0);
      }
      .cn-search-region,
      .cn-detail-region {
        grid-column: 2;
        min-width: 0;
      }
      .cn-flat-region {
        grid-column: 1 / -1;
        min-width: 0;
      }
      .cn-viz canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .cn-viz-live {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (max-width: 375px) {
        #app {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto minmax(320px, 55vh) auto auto;
          padding: 4px;
          gap: 4px;
        }
        .cn-status,
        .cn-search-region,
        .cn-viz,
        .cn-detail-region,
        .cn-flat-region {
          grid-column: 1;
          grid-row: auto;
        }
        .cn-status {
          padding: 0 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
